<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f2f3ed" />
        <meta
            name="description"
            content="byedeadline — планировщик проектов и задач с сохранением в браузере."
        />
        <title>byedeadline</title>
        <script>
            try {
                document.documentElement.dataset.theme = localStorage.getItem('byedeadline-theme') || 'light';
                document.documentElement.lang = localStorage.getItem('byedeadline-language') || 'ru';
            } catch {}
        </script>
        <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
            <symbol id="i-board" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <path d="M9 4v16m6-16v16" />
            </symbol>
            <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 20V10m8 10V4m8 16v-7" /></symbol>
            <symbol id="i-calendar" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="3" />
                <path d="M7 3v4m10-4v4M3 11h18m-11 5h4" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 5 5" />
            </symbol>
            <symbol id="i-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
            </symbol>
            <symbol id="i-moon" viewBox="0 0 24 24">
                <path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z" />
            </symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
            <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
            <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
            <symbol id="i-edit" viewBox="0 0 24 24">
                <path d="m14 5 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14v6Z" />
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7" />
            </symbol>
            <symbol id="i-archive" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="5" rx="1" />
                <path d="M5 8v12h14V8m-10 5h6" />
            </symbol>
            <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6" /></symbol>
        </svg>
        <aside class="sidebar" id="sidebar">
            <a class="brand" href="#overview">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M8 3v25h15V14H8" />
                </svg>
                byedeadline
                <span class="brand-dot">.</span>
            </a>
            <button class="icon-button sidebar-close" id="close-sidebar" type="button" data-label="close">
                <svg class="icon"><use href="#i-close" /></svg>
            </button>
            <nav class="primary-nav" data-label="navigation">
                <button type="button" data-view="overview">
                    <svg class="icon"><use href="#i-overview" /></svg>
                    <span data-i18n="overview">Обзор</span>
                </button>
                <button type="button" data-view="board">
                    <svg class="icon"><use href="#i-board" /></svg>
                    <span data-i18n="board">Доска задач</span>
                    <span id="nav-count" class="nav-count"></span>
                </button>
                <button type="button" data-view="upcoming">
                    <svg class="icon"><use href="#i-calendar" /></svg>
                    <span data-i18n="upcoming">Ближайшие сроки</span>
                </button>
            </nav>
            <div class="sidebar-heading">
                <span data-i18n="projects">Проекты</span>
                <button class="icon-button" id="add-project" type="button" data-label="newProject">
                    <svg class="icon"><use href="#i-plus" /></svg>
                </button>
            </div>
            <div id="project-list" class="project-list"></div>
            <div class="sidebar-bottom">
                <button class="archive-button" data-view="archive" type="button">
                    <svg class="icon"><use href="#i-archive" /></svg>
                    <span data-i18n="archive">Архив</span>
                </button>
            </div>
        </aside>
        <div
            id="sidebar-resize"
            class="sidebar-resize"
            role="separator"
            tabindex="0"
            aria-orientation="vertical"
            aria-valuemin="200"
            aria-valuemax="400"
            aria-valuenow="234"
            data-label="resizeSidebar"
        ></div>
        <button class="sidebar-scrim" id="sidebar-scrim" type="button" data-label="close" hidden></button>
        <div class="workspace">
            <header class="topbar">
                <div class="topbar-location">
                    <button
                        class="icon-button mobile-menu"
                        id="open-sidebar"
                        type="button"
                        aria-controls="sidebar"
                        aria-expanded="false"
                        data-label="navigation"
                    >
                        <svg class="icon"><use href="#i-menu" /></svg>
                    </button>
                    <span data-i18n="workspace">Моё пространство</span>
                    <span class="breadcrumb" aria-hidden="true">/</span>
                    <span id="current-view"></span>
                </div>
                <div class="preferences">
                    <div class="language-switch" role="group" data-label="language">
                        <button type="button" data-language="ru">RU</button>
                        <button type="button" data-language="en">EN</button>
                    </div>
                    <button class="icon-button" id="theme-toggle" type="button">
                        <svg class="icon"><use id="theme-icon" href="#i-moon" /></svg>
                    </button>
                </div>
            </header>
            <main id="main" tabindex="-1">
                <div class="page-heading">
                    <div>
                        <p id="page-kicker" class="kicker"></p>
                        <div class="project-title-row">
                            <h1 id="page-title" tabindex="-1"></h1>
                            <button
                                class="icon-button"
                                id="edit-project"
                                type="button"
                                data-label="editProject"
                                hidden
                            >
                                <svg class="icon"><use href="#i-edit" /></svg>
                            </button>
                        </div>
                        <p id="page-description" class="page-description"></p>
                    </div>
                    <div class="heading-actions">
                        <button class="button primary" id="new-task" type="button">
                            <svg class="icon"><use href="#i-plus" /></svg>
                            <span data-i18n="newTask">Новая задача</span>
                        </button>
                    </div>
                </div>
                <div class="toolbar" id="toolbar">
                    <label class="search-field">
                        <svg class="icon"><use href="#i-search" /></svg>
                        <input
                            id="search"
                            type="search"
                            data-placeholder="search"
                            data-label="search"
                            autocomplete="off"
                        />
                    </label>
                    <label class="filter-field">
                        <span data-i18n="priority">Приоритет</span>
                        <select id="priority-filter" data-label="priority">
                            <option value="all" data-i18n="allPriorities">Все</option>
                            <option value="high" data-i18n="high">Высокий</option>
                            <option value="medium" data-i18n="medium">Средний</option>
                            <option value="low" data-i18n="low">Низкий</option>
                        </select>
                    </label>
                </div>
                <div class="mobile-status" id="mobile-status" role="group" data-label="status"></div>
                <div id="view-content" class="view-content"></div>
            </main>
            <footer class="workspace-footer">
                <span>
                    byedeadline
                    <span aria-hidden="true">|</span>
                    <span data-i18n="localFooter">данные локальны</span>
                </span>
            </footer>
        </div>
        <dialog id="task-dialog" class="editor-dialog" aria-labelledby="task-dialog-title">
            <form id="task-form">
                <div class="dialog-heading">
                    <h2 id="task-dialog-title"></h2>
                    <button class="icon-button" type="button" data-close data-label="close">
                        <svg class="icon"><use href="#i-close" /></svg>
                    </button>
                </div>
                <label>
                    <span data-i18n="taskTitle">Название задачи</span>
                    <input name="title" required maxlength="160" data-placeholder="taskPlaceholder" />
                </label>
                <label>
                    <span data-i18n="description">Описание</span>
                    <textarea
                        name="description"
                        rows="3"
                        maxlength="2000"
                        data-placeholder="descriptionPlaceholder"
                    ></textarea>
                </label>
                <div class="form-grid">
                    <label class="project-field">
                        <span data-i18n="project">Проект</span>
                        <select name="projectId" required></select>
                    </label>
                    <label>
                        <span data-i18n="dueDate">Срок</span>
                        <input name="due" type="date" />
                    </label>
                    <label>
                        <span data-i18n="priority">Приоритет</span>
                        <select name="priority">
                            <option value="low" data-i18n="low">Низкий</option>
                            <option value="medium" data-i18n="medium">Средний</option>
                            <option value="high" data-i18n="high">Высокий</option>
                        </select>
                    </label>
                </div>
                <fieldset class="checklist-editor">
                    <legend data-i18n="checklist">Чек-лист</legend>
                    <div id="checklist-items"></div>
                    <div class="checklist-add">
                        <input
                            id="checklist-input"
                            maxlength="180"
                            data-placeholder="checklistPlaceholder"
                            data-label="checklistPlaceholder"
                        />
                        <button class="icon-button" id="add-checklist" type="button" data-label="addItem">
                            <svg class="icon"><use href="#i-plus" /></svg>
                        </button>
                    </div>
                </fieldset>
                <div class="dialog-actions">
                    <button class="text-button danger" id="delete-task" type="button" data-i18n="delete">
                        Удалить
                    </button>
                    <button class="button secondary" type="button" data-close data-i18n="cancel">
                        Отмена
                    </button>
                    <button class="button primary" type="submit" data-i18n="saveTask">
                        Сохранить задачу
                    </button>
                </div>
            </form>
        </dialog>
        <dialog
            id="project-dialog"
            class="editor-dialog compact-dialog"
            aria-labelledby="project-dialog-title"
        >
            <form id="project-form">
                <div class="dialog-heading">
                    <h2 id="project-dialog-title"></h2>
                    <button class="icon-button" type="button" data-close data-label="close">
                        <svg class="icon"><use href="#i-close" /></svg>
                    </button>
                </div>
                <label>
                    <span data-i18n="projectName">Название проекта</span>
                    <input name="name" required maxlength="80" data-placeholder="projectPlaceholder" />
                </label>
                <label>
                    <span data-i18n="projectDescription">Описание проекта</span>
                    <textarea
                        name="description"
                        rows="3"
                        maxlength="1200"
                        data-placeholder="projectDescriptionPlaceholder"
                    ></textarea>
                </label>
                <fieldset class="project-colors">
                    <legend data-i18n="color">Цвет проекта</legend>
                    <div id="color-options"></div>
                </fieldset>
                <div class="dialog-actions">
                    <button class="text-button danger" id="delete-project" type="button" data-i18n="delete">
                        Удалить
                    </button>
                    <button class="button secondary" type="button" data-close data-i18n="cancel">
                        Отмена
                    </button>
                    <button class="button primary" type="submit" data-i18n="save">Сохранить</button>
                </div>
            </form>
        </dialog>
        <dialog id="confirm-dialog" class="editor-dialog compact-dialog" aria-labelledby="confirm-title">
            <h2 id="confirm-title"></h2>
            <p id="confirm-copy"></p>
            <div class="dialog-actions">
                <button class="button secondary" type="button" data-close data-i18n="cancel">Отмена</button>
                <button class="button primary" id="confirm-action" type="button" data-i18n="confirm">
                    Подтвердить
                </button>
            </div>
        </dialog>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </body>
</html>
